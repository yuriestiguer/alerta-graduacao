name: alerta-graduacao
# "Plantão": cada execução roda a verificação a cada 10 min por ~5h30 e, ao terminar, chama a próxima.
# Motivo: o agendamento (cron) do GitHub não disparou neste repositório em 19/11/2026.
# O cron fica só como reserva; a tarefa "Cripto_Alerta_Guardiao" no PC do Yuri religa se o plantão cair.
on:
  schedule:
    - cron: "3 */2 * * *"
  workflow_dispatch:
concurrency:
  group: alerta
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  plantao:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - name: verifica a cada 10 min por ~5h30
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          fim=$((SECONDS + 330*60))
          while [ $SECONDS -lt $fim ]; do
            ini=$SECONDS
            echo "::group::rodada $(date -u +%H:%M)"
            git pull -q --ff-only || true    # pega ajustes do robô sem esperar o próximo plantão
            python3 alerta_graduacao.py --enviar || echo "rodada falhou (segue no próximo ciclo)"
            echo "::endgroup::"
            resto=$((600 - (SECONDS - ini)))
            [ $resto -gt 0 ] && [ $((SECONDS + resto)) -lt $fim ] && sleep $resto || true
            [ $((SECONDS + 600)) -ge $fim ] && break
          done
      - name: backup do registro (90 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estado-${{ github.run_id }}
          path: estado
          retention-days: 90
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado
          key: estado-${{ github.run_id }}
      - name: chama o próximo plantão
        if: ${{ !cancelled() }}
        run: |
          curl -s -o /dev/null -w "dispatch %{http_code}\n" -X POST -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/alerta.yml/dispatches -d '{"ref":"main"}'
          curl -s -o /dev/null -X PUT -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/alerta.yml/enable
