name: alerta-graduacao
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: alerta
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  rodar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - run: python3 alerta_graduacao.py --enviar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
      - id: hora
        if: always()
        run: echo "backup=$( [ "$(date -u +%H%M)" \< "0010" ] && echo sim || echo nao )" >> "$GITHUB_OUTPUT"
      - name: backup diário do registro (90 dias)
        if: always() && (steps.hora.outputs.backup == 'sim' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: estado-${{ github.run_id }}
          path: estado
          retention-days: 90
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado
          key: estado-${{ github.run_id }}
      - name: renova programação (GitHub desliga após 60 dias sem atividade)
        if: github.event.schedule && always()
        run: |
          if [ "$(date -u +%H%M)" \< "0010" ]; then
            curl -s -X PUT -H "Authorization: Bearer ${{ github.token }}"               https://api.github.com/repos/${{ github.repository }}/actions/workflows/alerta.yml/enable
          fi
